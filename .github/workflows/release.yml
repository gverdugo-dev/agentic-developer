name: release

# Build prebuilt adev binaries for every OS/arch and publish them to a GitHub
# Release whenever a version tag (vX.Y.Z) is pushed. install.sh / install.bat
# download these assets, so users never need a Go toolchain.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build all targets
        run: |
          mkdir -p dist
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for t in $targets; do
            export GOOS="${t%/*}" GOARCH="${t#*/}" CGO_ENABLED=0
            bin=adev
            [ "$GOOS" = windows ] && bin=adev.exe
            go build -trimpath -ldflags "-s -w" -o "$bin" ./cmd/adev
            if [ "$GOOS" = windows ]; then
              zip -q "dist/adev_${GOOS}_${GOARCH}.zip" "$bin"
            else
              tar -czf "dist/adev_${GOOS}_${GOARCH}.tar.gz" "$bin"
            fi
            rm -f "$bin"
          done
          cd dist && sha256sum * > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
